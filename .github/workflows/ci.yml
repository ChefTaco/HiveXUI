name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
      - name: Configure bounded authenticated package downloads
        run: sudo env GITHUB_ACTIONS=true bash scripts/ci-apt-setup.sh
      - name: Install ripgrep
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle
      - run: npm test
      - run: npm run check:contracts
      - run: bash scripts/privacy-output.test.sh
      - run: npm run scan:secrets
      - run: npm run check:private
      - name: Install Chromium and system dependencies
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - name: Accessibility check against a mocked runtime
        run: npm run e2e:a11y
