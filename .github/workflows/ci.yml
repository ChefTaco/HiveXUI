name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Configure bounded authenticated package downloads
        run: sudo bash scripts/ci-apt-setup.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:contracts
      - run: npm run scan:secrets
      - run: npm run check:private
