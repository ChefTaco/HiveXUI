name: Release image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-image
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/cheftaco/hivexui
jobs:
  gates:
    uses: ./.github/workflows/ci.yml
  build:
    needs: gates
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest-amd64: ${{ steps.result.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.result.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the native candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: hivexui-candidate:${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Verify non-root runtime and patched library
        env:
          CANDIDATE: hivexui-candidate:${{ matrix.arch }}
        run: |
          test "$(docker run --rm --entrypoint id "$CANDIDATE" -u)" = 101
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint sh "$CANDIDATE" -ec 'apk info -e "libxslt>=1.1.43-r4"; nginx -v'
          container=$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:mode=1777 --tmpfs /var/cache/nginx:uid=101,gid=101,mode=700 "$CANDIDATE")
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          ready=false
          for attempt in $(seq 1 40); do
            if docker exec "$container" wget -q -O /dev/null http://127.0.0.1:8080/health; then ready=true; break; fi
            sleep 0.25
          done
          test "$ready" = true
          page=$(docker exec "$container" wget -q -O - http://127.0.0.1:8080/fleet/commands)
          [[ "$page" == *'id="root"'* ]]
          docker image inspect "$CANDIDATE" --format '{{.Id}}' > "$RUNNER_TEMP/validated-config"
      - name: Scan all HIGH and CRITICAL findings before publication
        env:
          CANDIDATE: hivexui-candidate:${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/image-security"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/image-security:/reports" \
            aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
            --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output "/reports/hivexui-${{ matrix.arch }}.json" "$CANDIDATE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: image-security-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-security
          if-no-files-found: ignore
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Require the published candidate to match the scanned runtime
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          expected=$(cat "$RUNNER_TEMP/validated-config")
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw | jq -e --arg expected "$expected" '.config.digest==$expected'
      - id: result
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the multi-architecture image
        id: manifest
        env:
          AMD64: ${{ needs.build.outputs.digest-amd64 }}
          ARM64: ${{ needs.build.outputs.digest-arm64 }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "Refusing to overwrite $IMAGE:$version" >&2; exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$version" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Record the digest in a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Image: \`$IMAGE@$DIGEST\`"
