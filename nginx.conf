server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # A location that sets its own add_header otherwise drops every header set here.
  add_header_inherit merge;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /health { access_log off; return 200 'ok'; }
  location = /runtime.json { add_header Cache-Control no-store; try_files $uri =404; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /api/ { return 404; }
  location / { add_header Cache-Control no-cache; try_files $uri $uri/ /index.html; }
}
